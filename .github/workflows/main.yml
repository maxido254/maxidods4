name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/cache@v4
        with:
          path: ~\.nuget\packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build src/MaxiDodPS3 -c Release

      - name: Test
        run: dotnet test tests/MaxiDodPS3.Tests -c Release

      # With the debugger window (use this one to find problems)
      - name: Publish (debug)
        run: dotnet publish src/MaxiDodPS3 -c Release -r win-x64 --self-contained false -o publish-debug

      # Plain release: debugger not compiled in
      - name: Publish (release)
        run: dotnet publish src/MaxiDodPS3 -c Release -r win-x64 --self-contained false -p:EnableDebugger=false -o publish-release

      - uses: actions/upload-artifact@v4
        with:
          name: MaxiDodPS3-win-x64-DEBUG
          path: publish-debug

      - uses: actions/upload-artifact@v4
        with:
          name: MaxiDodPS3-win-x64-release
          path: publish-release
