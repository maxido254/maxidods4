name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj

      - name: Build
        run: dotnet build src/MaxiDodPS3 -c Release

      - name: Test
        run: dotnet test tests/MaxiDodPS3.Tests -c Release

      - name: Publish (with debugger)
        run: >
          dotnet publish src/MaxiDodPS3 -c Release -r win-x64
          --self-contained false -o publish-debug

      - name: Publish (release, no debugger)
        run: >
          dotnet publish src/MaxiDodPS3 -c Release -r win-x64
          --self-contained false -p:EnableDebugger=false -o publish-release

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish-debug/*   -DestinationPath MaxiDodPS3-win-x64-DEBUG.zip
          Compress-Archive -Path publish-release/* -DestinationPath MaxiDodPS3-win-x64-release.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MaxiDodPS3-win-x64-DEBUG
          path: MaxiDodPS3-win-x64-DEBUG.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MaxiDodPS3-win-x64-release
          path: MaxiDodPS3-win-x64-release.zip

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: MaxiDodPS3 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: MaxiDodPS3-win-x64-release.zip
