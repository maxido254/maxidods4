name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj

      - name: Build
        run: dotnet build src/MaxiDodPS3 -c Release

      - name: Test
        run: dotnet test tests/MaxiDodPS3.Tests -c Release

      - name: Publish the app (release, no debugger, self-contained)
        run: >
          dotnet publish src/MaxiDodPS3 -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableDebugger=false -o publish-release

      - name: Install WiX Toolset
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE\\.dotnet\\tools" >> "$GITHUB_PATH"

      - name: Build the MSI installer
        shell: bash
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p build
          cp installer/Product.wxs build/Product.wxs
          cp -r publish-release build/app
          ls -la build/app
          cd build
          sed -i "s/__VERSION__/0.2.${GITHUB_RUN_NUMBER}/" Product.wxs
          wix build -arch x64 -o MaxiDodPS3-Setup.msi Product.wxs
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: MaxiDodPS3-Setup
          path: build/MaxiDodPS3-Setup.msi

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: MaxiDodPS3 ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: MaxiDodPS3 for Windows. Download MaxiDodPS3-Setup.msi and open it to install. Install the ViGEmBus driver first if you do not have it.
          files: build/MaxiDodPS3-Setup.msi
